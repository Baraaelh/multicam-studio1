name: multicam_studio
description: Multi-camera live production system — LAN WebRTC, Firebase control plane, Active Stream Switching.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # WebRTC
  flutter_webrtc: ^1.0.0

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4

  # State management & DI
  get: ^4.6.6
  get_it: ^7.6.7

  # Native share sheet for sharing session code
  share_plus: ^10.0.0

  # UUID for session/peer IDs
  uuid: ^4.5.1

  # Runtime permissions
  permission_handler: ^11.3.1

  # Device info for camera registration
  device_info_plus: ^10.1.2

  # LAN file transfer (recording download)
  path_provider: ^2.1.3

  # Utilities
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
