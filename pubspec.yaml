name: multicam_studio
description: Multi-camera live production system — LAN WebRTC, Firebase control plane, Active Stream Switching.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # WebRTC
  flutter_webrtc: ^1.0.0

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  # Anonymous sign-in: gives each device a stable UID for security rules
  firebase_auth: ^5.5.0
  # App Check: only the genuine app may reach Firestore/Auth
  firebase_app_check: ^0.3.2

  # State management & DI
  get: ^4.6.6
  get_it: ^7.6.7

  # Native share sheet for sharing session code
  share_plus: ^10.0.0

  # UUID for session/peer IDs
  uuid: ^4.5.1

  # Runtime permissions
  permission_handler: ^11.3.1

  # Device info for camera registration
  device_info_plus: ^10.1.2

  # LAN file transfer (recording download)
  path_provider: ^2.1.3

  # Join QR: drawn on the admin, scanned by cameras
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.3

  # Utilities
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

# flutter_launcher_icons configuration
# Uses the asset image at assets/image/lanthuer.jfif
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/image/lanthuer.jfif"

flutter:
  uses-material-design: true

  assets:
    - assets/image/lanthuer.jfif

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
